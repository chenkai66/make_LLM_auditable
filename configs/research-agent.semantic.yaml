# Layer 2: curated semantic overlay for research-agent.
# Thin by design -- only couplings/intents that cannot be derived from code.
# Place at /data/research-agent/seamlens.semantic.yaml

artifact_groups:
  experiment_completion:
    members: ["done.json", "results.json", "result.json", "results_summary.json"]
    rationale: >
      Equivalent experiment-completion signals. The experimenter's canonical
      output is results_summary.json; done.json is the marker. invariant_checker
      must accept the full set or completed experiments get healed back to
      'designed' and loop forever (incident 2026-05-29).

constant_groups:
  worker_capacity:
    names: ["WORKER_CAP", "_W_CAP", "K_PER_CORE", "MAX_WORKERS", "GLOBAL_MAX"]
    rationale: >
      Per-core worker/slot capacity. Divergence (boss cores*6 vs claude_runner
      cores*9) caused boss to reject whole batches early (79->0 backpressure).
      Should route through worker_tuning.json.

# Filesystem-equivalent path fragments: `data` is a symlink to `data.default`,
# so DIR constants written either way resolve to the same location and are NOT
# divergent. [alias, canonical] -- alias is rewritten to canonical before compare.
path_aliases:
  - ["data.default/", "data/"]

# Genuinely-dead orphan libraries that are intentionally kept (none right now;
# add a relpath here to silence a confirmed-but-retained dead module).
allow_dead_modules: []

# Artifacts with no in-repo producer that are legitimately external/runtime
# inputs (config written by ops, runtime state, downloaded by worker, etc.).
# Entries may be exact names or globs. Each family below was positively
# confirmed external -- a removed in-repo producer would NOT match these, so it
# still surfaces. Keep this list to *verified* externals, not a catch-all.
allow_orphan_reads:
  - "config.json"
  - "worker_tuning.json"
  - "graph.db"
  - "errors.db"
  - "fleet_secret"
  - "oss_secrets"
  # LLM-subprocess outputs: written by a Claude agent inside its workspace per a
  # prompt (e.g. agents/debate.py instructs "Write {dir}/verdict.json"), so there
  # is no in-repo Python writer by design.
  - "verdict.json"
  - "review.json"
  - "failure_analysis.json"
  - "refined_idea.json"
  - "idea_themes.json"
  - "sota_table.json"
  - "qa_suggestions.json"
  # Ops/dashboard-written keys & config (hand-edited or written via REST handlers
  # the static extractor can't resolve to a literal path).
  - "*api*keys.json"
  - "*api_keys.json"
  - "keys.json"
  - "research_pro_keys.json"
  - "payment_config.json"
  - "custom_topics.json"
  - "priority_overrides.json"
  # Eval datasets downloaded by the experiment subprocess at runtime.
  - "gsm8k*.json"
  - "truthfulqa*.json"
  - "arc_easy*.json"
  - "activitynet*.json"
  - "*_dataset.json"
  - "embeddings.npy"
  - "embeddings.json"

daemons:
  - "framework/kg_patch_merger.py"
  - "fleet_server.py"
  - "supervisor.py"
  - "coordinator.py"
  - "scripts/kg_producer.py"

invariants:
  - "experiment FSM: 'designed' may reconcile to 'executed' iff a valid results_summary.json exists"
  - "any daemon importing error_logger must add an explicit StreamHandler (basicConfig becomes no-op)"
